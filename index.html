<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squint + Rocket</title>
  <style>
    demo-counter { display: block; margin-bottom: 0.5rem; }
    demo-counter div { display: flex; gap: 0.5rem; align-items: center; }
  </style>
</head>
<body>
  <h1>Squint + Rocket</h1>
  <p>The counter is a Rocket element written in Squint. The buttons use Datastar attributes.</p>
  <demo-counter id="counter" start="2" step="3" label="Inventory"></demo-counter>
  <button type="button" data-on:click="counter.start = 10">Set start to 10</button>
  <script type="module" src="./target/counter.min.js"></script>
</body>
</html>
